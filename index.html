<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 플립 명함 - 김두부벽돌</title>

    <!-- 외부 CSS 파일을 불러와 디자인 적용 -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- [사고의 흐름] 카드가 3D 뒤집히려면, 카메라(사용자의 눈)와 물체(카드) 사이의 '거리(원근감)'를 설정할 부모 컨테이너가 필요함-->
    <div class="card-container">
      <!-- 실제 앞/뒷면을 감싸고 있으며, 이 박스 자체가 180도 회전하게 됨 -->
      <div class="card-inner" id="flipCard">
        <!-- 카드 앞면: 프로필 사진, 이름, 직업 -->
        <div class="card-front">
          <!-- 프로필 이미지가 들어갈 공간(CSS에서 배경 이미지로 처리) -->
          <div class="profile-img"></div>
          <h2>김두부벽돌</h2>
          <p>FullStack Designer</p>
        </div>

        <!-- 카드 뒷면: 글래스모피즘 효과와 상세 정보 리스트 -->
        <div class="card-back">
          <h3>Profile Info</h3>
          <ul>
            <!-- 1. Email -->
            <li>
              <div class="item-icon">
                <!-- 편지 봉투 아이콘 -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6zm-2 0l-8 5-8-5h16zm0 12H4V8l8 5 8-5v10z"/></svg>
                </svg>
              </div>
              <div class="item-text">
                <strong>Email: </strong>
                <span> tofu-brick@example.com</span>
              </div>
            </li>

            <!-- 2. phone -->
            <li>
              <div class="item-icon">
                <!-- 전화기 아이콘 -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
              </div>
              <div class="item-text">
                <strong>Phone: </strong>
                <span>010-1234-1234</span>
              </div>
            </li>

            <!-- 3. Skills -->
            <li>
              <div class="item-icon">
                <!-- 개발/코드(괄호) 아이콘 -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
              </div>
              <div class="item-text">
                <strong>Skills:</strong>
                <span>JAVA, HTML, CSS, JAVA SCRIPT, SPRING BOOT</span>
              </div>
            </li>

            <!-- 4. Hobby -->
            <li>
              <div class="item-icon">
                <!-- 외국어/글로벌(지구본) 아이콘  -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.34.16-2h4.68c.09.66.16 1.32.16 2 0 .68-.07 1.34-.16 2zm1.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
              </div>
              <div class="item-text">
                <strong>Hobby: </strong>
                <span>JAPANESE</span>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 외부 JavaScript 파일을 문서 맨 끝에서 불러와 상호작용을 추가 -->
    <script src="script.js"></script>
  </body>
</html>
